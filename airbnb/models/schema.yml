models:
  - name: dim_listing_cleansed
    description: Cleansed table which contains all the listings and their associated hosts. This table is used to join with the reviews table to get the reviews for each listing.
    columns:
     - name: listing_id
       description: The unique identifier for each listing.
       data_tests:
         - unique
         - not_null

     - name: host_id
       description: The unique identifier for each host.
       data_tests:
         - not_null
         - relationships:
             arguments:
               to: ref('dim_host_cleansed')
               field: host_id
     - name: room_type
       description: The type of room for the listing.
       data_tests:
         - accepted_values:
             arguments:
               values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
     - name: minimum_nights
       description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'

  - name: dim_host_cleansed
    description: Dim for host cleaned
    config:
      contract:
        enforced: true
    columns:
    - name: host_id
      description: The unique identifier for each host.
      data_tests:
        - unique
        - not_null
    - name: host_name
      description: The name of the host.
      data_tests:
        - not_null
    - name: is_superhost
      description: Whether the host is a superhost or not. This is a boolean value.
      data_tests:
        - accepted_values:
            arguments:
                values: ['t', 'f']
    - name: host_id
      description: The unique identifier for each host.
      data_type: integer
    - name: host_name
      data_type: string
    - name: is_superhost
      data_type: string
    - name: updated_at
      data_type: timestamp
    - name: created_at
      data_type: timestamp
  - name: dim_listings_w_host
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                max_value: 5000
              config:
                severity: WARN